[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-mail-merge"
version = "0.1.0"
description = "Linux-first local mail merge client"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "markdown>=3.7",
  "beautifulsoup4>=4.12",
  "keyring>=25.4",
  "cryptography>=43",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "aiosmtpd>=1.4"]

[project.scripts]
mailmerge = "mailmerge.main:run"
mailmerge-worker = "mailmerge.worker:run"
mailmerge-unsubscribe = "unsubscribe_service.main:run"
mailmerge-test-email = "mailmerge.test_email:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mailmerge", "src/unsubscribe_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
